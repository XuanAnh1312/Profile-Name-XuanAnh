<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Portfolio Admin</title>
    <link rel="stylesheet" href="portfolio.css">
    <script src="portfolio.js" defer></script>
</head>
<body data-page="login">
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-heading">
                <div class="login-mark"><i class="fa-solid fa-lock"></i></div>
                <h1 id="loginTitle">Khu vực quản trị</h1>
                <p>Đăng nhập để cập nhật portfolio và dự án.</p>
            </div>
            <p class="form-error" id="loginErrorMsg" role="alert">Tên đăng nhập hoặc mật khẩu không chính xác.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginUser">Tài khoản</label>
                    <input class="form-control" type="text" id="loginUser" autocomplete="username" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPass">Mật khẩu</label>
                    <input class="form-control" type="password" id="loginPass" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                </div>
                <button class="btn btn-primary" type="submit" style="width:100%">Đăng nhập</button>
            </form>
            <a class="login-back" href="homepage-client.html"><i class="fa-solid fa-arrow-left"></i> Trở về portfolio</a>
            <p class="login-back">Bản demo: <strong>admin</strong> / <strong>123456</strong></p>
        </section>
    </main>
</body>
</html>
