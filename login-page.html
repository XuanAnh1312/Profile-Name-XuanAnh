<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portfolio Admin</title>
    <link rel="stylesheet" href="portfolio.css">
    <script src="portfolio.js" defer></script>
</head>
<body data-page="login">
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-heading">
                <div class="login-mark"><i class="fa-solid fa-lock"></i></div>
                <h1 id="loginTitle">Admin area</h1>
                <p>Log in to update the portfolio and projects.</p>
            </div>
            <p class="form-error" id="loginErrorMsg" role="alert">The username or password is incorrect.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginUser">Username</label>
                    <input class="form-control" type="text" id="loginUser" autocomplete="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPass">Password</label>
                    <input class="form-control" type="password" id="loginPass" autocomplete="current-password" placeholder="Enter password" required>
                </div>
                <button class="btn btn-primary" type="submit" style="width:100%">Log in</button>
            </form>
            <a class="login-back" href="homepage-client.html"><i class="fa-solid fa-arrow-left"></i> Back to portfolio</a>
            <p class="login-back">Demo account: <strong>admin</strong> / <strong>123456</strong></p>
        </section>
    </main>
</body>
</html>
